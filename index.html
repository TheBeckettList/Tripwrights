<!doctype html>
<html lang="en" data-place="tripwrights">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tripwrights</title>
<meta name="description" content="Plan a vacation as easily as you play a game: pick a region on the globe, board its yacht, pick what to do, morning, afternoon, evening.">
<link rel="stylesheet" href="art/tokens.css">
<style>
/* Tripwrights wears the shared island art kit (art/tokens.css, copied from utilatarian/art). Its own color is sea blue.
   The world fills the screen; the controls float over it like a game's HUD. */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body,html[data-place]{margin:0;min-height:100%;background:#7FCBE0}
body{color:var(--ink);font:16px/1.45 var(--u-body);-webkit-tap-highlight-color:transparent}
.cap{height:calc(66px + env(safe-area-inset-top));background:#5DB7D2}
.scene{display:block;width:100%;max-width:920px;height:auto;margin:0 auto;user-select:none;-webkit-user-select:none}
/* HUD */
.hud{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 10px;pointer-events:none}
.hud>*{pointer-events:auto}
.pill{border:0;cursor:pointer;min-height:44px;padding:0 18px;border-radius:999px;background:var(--card);color:var(--accent-deep);font:800 16px var(--u-display);box-shadow:0 0 0 4px var(--soft),0 6px 0 rgba(15,42,67,.12);display:inline-flex;align-items:center;gap:6px}
.pill{white-space:nowrap}
.brand{font-size:21px;letter-spacing:-.01em}
@media (max-width:480px){.brand small{display:none}}
.brand small{font:700 13px var(--u-body);color:var(--ink2)}
.pill.plan{margin-left:auto;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--edge)}
.toast{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;max-width:calc(100% - 32px);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 20px;font:700 15px var(--u-body);box-shadow:0 0 0 4px var(--soft),0 8px 20px rgba(15,42,67,.15);text-align:center;pointer-events:none;transition:opacity .4s}
.toast.off{opacity:0}
/* objects in the scene */
.obj{cursor:pointer;outline:none}
.obj .lift{transition:transform .18s ease;transform-box:fill-box;transform-origin:center}
.obj:hover .lift,.obj:focus-visible .lift{transform:translateY(-6px) scale(1.03)}
.obj:active .lift{transform:translateY(-2px) scale(.98)}
.obj:focus-visible .ring{opacity:1}
.ring{fill:none;stroke:#fff;stroke-width:5;stroke-dasharray:10 8;opacity:0;pointer-events:all}
.tag{font:800 32px 'Baloo 2',sans-serif;fill:#fff;paint-order:stroke;stroke:rgba(15,42,67,.62);stroke-width:9px;stroke-linejoin:round;pointer-events:none}
.bob{animation:bob 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.spin{animation:spin 1.1s linear infinite;transform-box:fill-box;transform-origin:center}
.cloud{animation:drift 14s ease-in-out infinite alternate}
.cloud:nth-child(2n){animation-duration:18s}
@keyframes bob{50%{transform:translateY(6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{to{transform:translateX(40px)}}
.arrive{transition:transform 1.4s cubic-bezier(.3,.7,.3,1)}
@media (prefers-reduced-motion: reduce){.bob,.spin,.cloud{animation:none}.arrive,.obj .lift{transition:none}}
/* the globe, full screen */
.globe{position:fixed;inset:0;z-index:6;background:#CFE8F2;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.globe.on{opacity:1;pointer-events:auto}
.globe svg{width:100%;height:100%;max-width:100vh;touch-action:none;cursor:grab}
.globe .gtitle{position:absolute;top:max(14px,env(safe-area-inset-top));left:0;right:0;text-align:center;font:800 28px var(--u-display);color:var(--accent-deep);pointer-events:none}
.globe .gtitle small{display:block;font:700 15px var(--u-body);color:var(--ink2)}
.globe .pill{position:absolute;right:12px;top:max(10px,env(safe-area-inset-top))}
/* sheets */
.veil{position:fixed;inset:0;z-index:7;background:rgba(8,22,36,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:8;left:50%;bottom:0;width:100%;max-width:560px;max-height:80vh;overflow:auto;background:var(--card);color:var(--ink);border-radius:34px 34px 0 0;box-shadow:0 0 0 5px var(--soft),0 -10px 30px rgba(0,0,0,.25);
  padding:20px 16px max(26px,env(safe-area-inset-bottom));transform:translate(-50%,105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.sheet.on{transform:translate(-50%,0);visibility:visible;transition:transform .25s ease}
.sheet h2{font:800 28px/1.05 var(--u-display);margin:0 52px 4px 0}
.sheet p.lede{margin:0 0 12px;color:var(--ink2)}
.close{position:absolute;right:10px;top:10px;min-width:44px;min-height:44px;border:0;background:transparent;color:var(--accent-deep);font:800 26px var(--u-display);cursor:pointer}
.item{display:block;width:100%;text-align:left;border:0;font:inherit;color:inherit;border-radius:24px;padding:12px 14px;margin:8px 0;background:var(--wash);box-shadow:inset 0 0 0 2px var(--soft)}
button.item{cursor:pointer}
.item b{display:block;font-family:var(--u-display);font-size:18px}
.where{color:var(--ink2);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:13px;font-weight:800;padding:3px 12px;border-radius:14px;background:var(--card);color:var(--ink2);box-shadow:inset 0 0 0 2px var(--line)}
.chip.ok{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.chip.off{opacity:.5;text-decoration:line-through}
.chip.soon{background:var(--w-closed);color:var(--w-closed-ink);box-shadow:none}
.btn{display:inline-block;min-height:44px;padding:10px 24px;border-radius:999px;background:var(--accent);color:var(--accent-ink);border:0;font:800 17px var(--u-display);cursor:pointer;margin-top:8px;box-shadow:0 4px 0 var(--edge)}
.note{font-size:13px;color:var(--ink2);margin-top:10px}
.days{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.days button{border:0;cursor:pointer;min-height:36px;padding:0 12px;border-radius:14px;background:var(--wash);color:var(--accent-deep);box-shadow:inset 0 0 0 2px var(--soft);font:800 14px var(--u-body)}
.days button.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.pcard{border-radius:26px;padding:14px 16px;margin:6px 0 10px}
.add{margin:6px 6px 0 0;min-height:40px;padding:8px 16px;font-size:15px}
.add.done{background:var(--w-ok);color:var(--w-ok-ink);box-shadow:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<h1 class="sr">Tripwrights: plan a vacation as easily as you play a game</h1>
<div class="hud">
  <button class="pill" id="back" hidden>&larr; <span id="backl">Home</span></button>
  <button class="pill brand" id="brand">Tripwrights <small id="sub"></small></button>
  <button class="pill plan" id="planbtn">Plan &middot; <span id="pn">0</span></button>
</div>
<div class="cap" id="cap"></div>
<svg class="scene" id="scene" viewBox="0 0 1000 1800" role="group" aria-label="Tripwrights"></svg>
<div class="toast" id="toast"></div>

<div class="globe" id="globe" aria-hidden="true">
  <div class="gtitle">Where to?<small>Spin the globe. Tap a lit-up region.</small></div>
  <svg id="gsvg" viewBox="-500 -500 1000 1000" role="group" aria-label="The globe: spin it and pick a region"></svg>
  <button class="pill" id="gclose" aria-label="Close the globe">&times;</button>
</div>

<div class="veil" id="veil"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="st" aria-hidden="true">
  <button class="close" id="close" aria-label="Close">&times;</button>
  <h2 id="st"></h2><p class="lede" id="sl"></p><div id="sb"></div>
</aside>
<script src="art/palettes.js"></script><script src="art/josie.js"></script><script src="art/world.js"></script><script src="art/land.js"></script>
<script src="data.js"></script><script src="globe.js"></script><script src="scenes.js"></script>
<script src="app.js"></script>
</body>
</html>
