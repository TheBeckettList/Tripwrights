<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tripwrights</title>
<meta name="description" content="Plan the trip like an outfitter would: morning, afternoon, evening.">
<style>
:root{
  --ink:#0F2A43; --sea:#1F5F8B; --tide:#4A90B8; --ice:#E8F1F6; --paper:#F6F1E7;
  --brass:#B8873B; --brass-ink:#2A1D07; --kelp:#3E7C6B; --rust:#C8553D;
  --floor:#E9DFC9; --floor2:#DDD0B4; --wall:#12385A; --deep:#1B5E86; --shallow:#6FB0CF;
  --bg:#E8F1F6; --text:#0F2A43; --card:#F6F1E7; --line:rgba(15,42,67,.18);
}
:root[data-theme="dark"]{ --bg:#0B1E31; --text:#EAF2F7; --card:#14314B; --line:rgba(234,242,247,.2); }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0B1E31; --text:#EAF2F7; --card:#14314B; --line:rgba(234,242,247,.2); }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:560px;padding:14px 16px 6px;display:flex;align-items:baseline;justify-content:space-between}
h1{font:700 26px/1 Georgia,"Fraunces","Bitter",serif;margin:0;letter-spacing:.2px}
header small{opacity:.75}
main{width:100%;max-width:560px;padding:0 16px 24px}
.hint{margin:2px 0 10px;opacity:.8;font-size:15px}
.scene{display:block;width:100%;height:auto;border-radius:18px;border:2px solid var(--line);background:var(--shallow)}
.obj{cursor:pointer;outline:none}
.obj .lift{transition:transform .15s ease;transform-box:fill-box;transform-origin:center}
.obj:hover .lift,.obj:focus-visible .lift{transform:translateY(-6px) scale(1.04)}
.obj:focus-visible .ring{opacity:1}
.ring{fill:none;stroke:#fff;stroke-width:5;stroke-dasharray:10 8;opacity:0}
.badge text{font:700 22px Georgia,serif;fill:var(--brass-ink)}
.tag{font:700 34px Georgia,serif;fill:#fff;paint-order:stroke;stroke:rgba(10,30,50,.7);stroke-width:9px;stroke-linejoin:round}
.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.spin{animation:spin 1.1s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.bob,.spin{animation:none}}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(8,22,36,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:560px;max-height:78vh;overflow:auto;
  background:var(--card);color:var(--text);border-radius:22px 22px 0 0;border-top:4px solid var(--brass);
  padding:18px 16px 26px;transform:translate(-50%,105%);transition:transform .25s ease;box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.sheet.on{transform:translate(-50%,0)}
.sheet h2{font:700 24px/1.1 Georgia,serif;margin:0 0 4px}
.sheet p.lede{margin:0 0 12px;opacity:.85}
.close{position:absolute;right:10px;top:10px;min-width:44px;min-height:44px;border:0;background:transparent;color:inherit;font-size:26px;cursor:pointer}
.item{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;background:var(--bg)}
.item b{display:block}
.item span.where{opacity:.75;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:13px;padding:3px 9px;border-radius:99px;border:1px solid var(--line)}
.chip.ok{border-color:var(--kelp);color:var(--kelp)}
.chip.off{opacity:.45;text-decoration:line-through}
.chip.soon{border-color:var(--rust);color:var(--rust)}
.btn{display:inline-block;min-height:44px;padding:10px 18px;border-radius:12px;background:var(--sea);color:#fff;border:0;font:600 16px inherit;cursor:pointer;margin-top:8px}
.btn[disabled]{opacity:.5;cursor:default}
.note{font-size:13px;opacity:.7;margin-top:10px}
</style>
</head>
<body>
<header><h1>Tripwrights</h1><small>Outfitters &amp; trip planners</small></header>
<main>
<p class="hint">Pick something up. Each thing in the shop opens what you can do with it.</p>

<svg class="scene" viewBox="0 0 1000 1280" role="group" aria-label="The Tripwrights shop and dock. Tap an object to see activities.">
  <defs>
    <pattern id="planks" width="1000" height="44" patternUnits="userSpaceOnUse"><rect width="1000" height="44" fill="#E9DFC9"/><rect y="40" width="1000" height="4" fill="#D6C7A6"/></pattern>
    <pattern id="dock" width="1000" height="38" patternUnits="userSpaceOnUse"><rect width="1000" height="38" fill="#C9A878"/><rect y="34" width="1000" height="4" fill="#A98B5E"/></pattern>
    <pattern id="tile" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="#EFE7D3"/><rect width="30" height="30" fill="#E5DAC0"/><rect x="30" y="30" width="30" height="30" fill="#E5DAC0"/></pattern>
  </defs>

  <!-- sea -->
  <rect width="1000" height="1280" fill="#6FB0CF"/>
  <path d="M0 900 C200 870 380 930 560 900 S860 870 1000 910 V1280 H0Z" fill="#4A90B8"/>
  <path d="M0 1050 C240 1010 420 1090 620 1050 S880 1030 1000 1070 V1280 H0Z" fill="#1F6F9C"/>
  <g stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".6">
    <path d="M90 960h70M620 990h90M780 1130h80M200 1150h60M520 1190h70"/>
  </g>

  <!-- building -->
  <rect x="30" y="30" width="940" height="760" rx="14" fill="url(#planks)" stroke="#12385A" stroke-width="10"/>
  <rect x="30" y="30" width="940" height="110" rx="14" fill="#12385A"/>
  <!-- wall windows & lanterns -->
  <g fill="#9CC9DE"><rect x="70" y="52" width="110" height="64" rx="6"/><rect x="820" y="52" width="110" height="64" rx="6"/></g>
  <g stroke="#12385A" stroke-width="4"><path d="M125 52v64M70 84h110M875 52v64M820 84h110"/></g>
  <g fill="#B8873B"><circle cx="380" cy="86" r="18"/><circle cx="620" cy="86" r="18"/></g>
  <g fill="#FFE29A" opacity=".9"><circle cx="380" cy="86" r="9"/><circle cx="620" cy="86" r="9"/></g>
  <!-- rug -->
  <ellipse cx="500" cy="440" rx="330" ry="250" fill="#1F5F8B" opacity=".18"/>
  <ellipse cx="500" cy="440" rx="300" ry="224" fill="none" stroke="#B8873B" stroke-width="4" stroke-dasharray="3 12" stroke-linecap="round"/>
  <!-- door -->

  <!-- GLOBE table (center) -->
  <g class="obj" tabindex="0" role="button" aria-label="Globe: where can you go" data-k="globe">
    <circle class="ring" cx="500" cy="440" r="170"/>
    <g class="lift">
      <ellipse cx="500" cy="590" rx="150" ry="26" fill="#000" opacity=".12"/>
      <circle cx="500" cy="440" r="140" fill="#0F2A43"/>
      <circle cx="500" cy="440" r="124" fill="#2F7FAE"/>
      <g fill="#9BC38C"><path d="M420 380c30-30 60-20 80 0s10 40-20 40-30 30-60 20-20-40 0-60z"/><path d="M540 470c30-10 55 10 45 40s-40 40-60 20-10-50 15-60z"/><path d="M470 330c20-10 50-5 55 10s-30 20-55 5z"/></g>
      <ellipse cx="500" cy="440" rx="124" ry="42" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
      <ellipse cx="500" cy="440" rx="42" ry="124" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
      <path d="M360 440a140 140 0 0 1 280 0" fill="none" stroke="#B8873B" stroke-width="10"/>
      <circle cx="610" cy="355" r="9" fill="#C8553D"/>
    </g>
    <g class="badge"><circle cx="618" cy="338" r="24" fill="#E7B965" stroke="#fff" stroke-width="4"/><text x="618" y="347" text-anchor="middle">1</text></g>
    <text class="tag" x="500" y="618" text-anchor="middle">The globe</text>
  </g>

  <!-- HELMET shelf (left) : dive -->
  <g class="obj" tabindex="0" role="button" aria-label="Diving helmet: dive and underwater" data-k="dive">
    <rect class="ring" x="50" y="170" width="220" height="240" rx="20"/>
    <g class="lift">
      <rect x="60" y="190" width="200" height="200" rx="14" fill="#6B4A2A"/>
      <rect x="72" y="202" width="176" height="176" rx="10" fill="#8B6238"/>
      <circle cx="160" cy="300" r="68" fill="#B8873B"/>
      <circle cx="160" cy="300" r="68" fill="none" stroke="#7A5620" stroke-width="6"/>
      <circle cx="160" cy="300" r="34" fill="#12385A" stroke="#7A5620" stroke-width="8"/>
      <circle cx="148" cy="290" r="8" fill="#9CC9DE" opacity=".8"/>
      <g fill="#7A5620"><circle cx="160" cy="232" r="6"/><circle cx="160" cy="368" r="6"/><circle cx="92" cy="300" r="6"/><circle cx="228" cy="300" r="6"/></g>
      <rect x="140" y="226" width="40" height="14" rx="4" fill="#E7B965"/>
    </g>
    <text class="tag" x="160" y="430" text-anchor="middle">Dive</text>
  </g>

  <!-- SKIS rack (right): snow & ice -->
  <g class="obj" tabindex="0" role="button" aria-label="Skis: snow and ice" data-k="snow">
    <rect class="ring" x="730" y="170" width="220" height="250" rx="20"/>
    <g class="lift">
      <rect x="750" y="190" width="180" height="200" rx="14" fill="#6B4A2A"/>
      <g transform="rotate(-14 840 290)">
        <rect x="780" y="170" width="26" height="250" rx="13" fill="#4A90B8"/><rect x="780" y="170" width="26" height="40" rx="13" fill="#0F2A43"/>
        <rect x="830" y="170" width="26" height="250" rx="13" fill="#F6F1E7"/><rect x="830" y="170" width="26" height="40" rx="13" fill="#C8553D"/>
        <rect x="880" y="170" width="26" height="250" rx="13" fill="#1F5F8B"/><rect x="880" y="170" width="26" height="40" rx="13" fill="#0F2A43"/>
      </g>
      <path d="M770 392h140" stroke="#B8873B" stroke-width="8" stroke-linecap="round"/>
    </g>
    <text class="tag" x="840" y="440" text-anchor="middle">Snow &amp; ice</text>
  </g>

  <!-- BUNK (bottom-left of room): stay -->
  <g class="obj" tabindex="0" role="button" aria-label="Bunk and lantern: places to stay" data-k="stay">
    <rect class="ring" x="50" y="530" width="270" height="240" rx="20"/>
    <g class="lift">
      <rect x="70" y="560" width="210" height="150" rx="12" fill="#6B4A2A"/>
      <rect x="82" y="572" width="186" height="126" rx="8" fill="#1F5F8B"/>
      <rect x="82" y="572" width="186" height="46" rx="8" fill="#F6F1E7"/>
      <rect x="96" y="580" width="62" height="30" rx="10" fill="#fff"/>
      <rect x="180" y="640" width="76" height="44" rx="8" fill="#B8873B" opacity=".9"/>
      <g><rect x="238" y="716" width="30" height="40" rx="6" fill="#B8873B"/><rect x="244" y="724" width="18" height="24" rx="4" fill="#FFE29A"/><path d="M243 716v-8h20v8" stroke="#7A5620" stroke-width="4" fill="none"/></g>
    </g>
    <text class="tag" x="180" y="548" text-anchor="middle">Stay</text>
  </g>

  <!-- KITCHEN (bottom-right of room): eat -->
  <g class="obj" tabindex="0" role="button" aria-label="Stove and pot: places to eat" data-k="eat">
    <rect class="ring" x="690" y="540" width="270" height="230" rx="20"/>
    <g class="lift">
      <rect x="700" y="560" width="240" height="150" rx="12" fill="#C9D3DA"/>
      <rect x="712" y="572" width="216" height="126" rx="8" fill="#E8EEF2"/>
      <circle cx="770" cy="625" r="34" fill="#2A3946"/><circle cx="770" cy="625" r="22" fill="#B8873B"/>
      <circle cx="770" cy="625" r="14" fill="#6B4A2A"/><path d="M760 592c-4-12 6-14 2-26M778 592c-4-12 6-14 2-26" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".8"/>
      <circle cx="868" cy="625" r="30" fill="#2A3946"/><circle cx="868" cy="625" r="18" fill="#C8553D"/>
      <rect x="712" y="676" width="216" height="14" rx="4" fill="#B8873B"/>
    </g>
    <text class="tag" x="820" y="548" text-anchor="middle">Eat</text>
  </g>

  <!-- SPA shell (middle-left lower): rest -->
  <g class="obj" tabindex="0" role="button" aria-label="Spa shell: rest and spa" data-k="rest">
    <rect class="ring" x="350" y="620" width="300" height="140" rx="20"/>
    <g class="lift">
      <ellipse cx="500" cy="690" rx="125" ry="52" fill="#E8F1F6" stroke="#4A90B8" stroke-width="6"/>
      <ellipse cx="500" cy="690" rx="100" ry="38" fill="#9CC9DE"/>
      <path d="M440 700c0-34 26-58 60-58s60 24 60 58c-18-10-40-14-60-14s-42 4-60 14z" fill="#F6F1E7" stroke="#B8873B" stroke-width="4"/>
      <path d="M500 646v38M470 654l12 32M530 654l-12 32" stroke="#B8873B" stroke-width="3" opacity=".7"/>
    </g>
    <text class="tag" x="500" y="775" text-anchor="middle">Rest &amp; spa</text>
  </g>

  <!-- DOCK -->
  <rect x="30" y="800" width="940" height="76" fill="url(#dock)"/>
  <g fill="#6B4A2A"><circle cx="70" cy="838" r="9"/><circle cx="210" cy="838" r="9"/><circle cx="350" cy="838" r="9"/><circle cx="650" cy="838" r="9"/><circle cx="790" cy="838" r="9"/><circle cx="930" cy="838" r="9"/></g>
  <rect x="120" y="876" width="90" height="190" fill="url(#dock)"/>

  <!-- TALL SHIP (top-down): sail -->
  <g class="obj" tabindex="0" role="button" aria-label="Tall ship: sail and boat trips" data-k="sail">
    <rect class="ring" x="50" y="900" width="400" height="330" rx="26"/>
    <g class="lift bob">
      <path d="M230 900c60 6 100 50 100 120s-40 160-100 200c-60-40-100-130-100-200s40-114 100-120z" fill="#7A4E26" stroke="#4A2D12" stroke-width="6"/>
      <path d="M230 920c44 6 70 40 70 96s-28 130-70 164c-42-34-70-108-70-164s26-90 70-96z" fill="#C9A878"/>
      <rect x="225" y="940" width="10" height="250" fill="#4A2D12"/>
      <path d="M170 980h120c-10 14-10 28 0 42H170c10-14 10-28 0-42z" fill="#F6F1E7" stroke="#B8873B" stroke-width="3"/>
      <path d="M180 1060h100c-8 12-8 24 0 36H180c8-12 8-24 0-36z" fill="#F6F1E7" stroke="#B8873B" stroke-width="3"/>
      <circle cx="230" cy="1140" r="12" fill="#B8873B"/>
      <path d="M230 900v-30" stroke="#C8553D" stroke-width="6"/><path d="M230 870l32 10-32 10z" fill="#C8553D"/>
    </g>
    <text class="tag" x="250" y="1262" text-anchor="middle">Sail</text>
  </g>

  <!-- BUBBLE HELICOPTER on pad: fly -->
  <g class="obj" tabindex="0" role="button" aria-label="Bubble helicopter: flights and tours" data-k="fly">
    <rect class="ring" x="560" y="900" width="390" height="330" rx="26"/>
    <g class="lift">
      <rect x="600" y="930" width="320" height="260" rx="30" fill="#B8873B" opacity=".25"/>
      <rect x="600" y="930" width="320" height="260" rx="30" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="14 12"/>
      <text x="760" y="1080" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="120" fill="#fff" opacity=".35">H</text>
      <rect x="745" y="1130" width="30" height="90" rx="10" fill="#1F5F8B"/>
      <ellipse cx="760" cy="1050" rx="58" ry="78" fill="#EAF2F7" stroke="#0F2A43" stroke-width="6"/>
      <ellipse cx="760" cy="1020" rx="40" ry="46" fill="#9CC9DE" stroke="#0F2A43" stroke-width="4"/>
      <ellipse cx="748" cy="1004" rx="12" ry="18" fill="#fff" opacity=".6"/>
      <rect x="696" y="1100" width="128" height="10" rx="5" fill="#0F2A43"/>
      <g class="spin"><rect x="615" y="1040" width="290" height="14" rx="7" fill="#0F2A43" opacity=".55"/><rect x="753" y="905" width="14" height="290" rx="7" fill="#0F2A43" opacity=".55"/></g>
      <circle cx="760" cy="1047" r="12" fill="#B8873B"/>
    </g>
    <text class="tag" x="760" y="1262" text-anchor="middle">Fly</text>
  </g>

  <!-- sign -->
  <g>
    <rect x="360" y="152" width="280" height="54" rx="10" fill="#0F2A43" stroke="#B8873B" stroke-width="5"/>
    <text x="500" y="190" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="30" fill="#F6F1E7">TRIPWRIGHTS</text>
  </g>
</svg>
<p class="note">Everything in the sheets is sample text for the prototype. Utila is the first island on the globe.</p>
</main>

<div class="veil" id="veil"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="st" aria-hidden="true">
  <button class="close" id="close" aria-label="Close">×</button>
  <h2 id="st"></h2>
  <p class="lede" id="sl"></p>
  <div id="sb"></div>
</aside>

<script>
(function(){
  var B = {m:'Morning', a:'Afternoon', e:'Evening'};
  function chips(open){ return '<div class="chips">' + ['m','a','e'].map(function(k){
    return '<span class="chip ' + (open.indexOf(k) > -1 ? 'ok' : 'off') + '">' + B[k] + '</span>'; }).join('') + '</div>'; }
  function item(n, w, open, extra){ return '<div class="item"><b>' + n + '</b><span class="where">' + w + '</span>' + chips(open) + (extra || '') + '</div>'; }
  var D = {
    globe:{t:'The globe', l:'Where do you want to go? Pick an island to see what is open there.', b:
      item('Utila, Honduras','Live now · reef, cays, quiet town',['m','a','e']) +
      '<div class="item"><b>Roatán</b><span class="where">Soon</span><div class="chips"><span class="chip soon">Coming</span></div></div>' +
      '<div class="item"><b>Guanaja</b><span class="where">Soon</span><div class="chips"><span class="chip soon">Coming</span></div></div>' +
      '<div class="item"><b>Koh Tao, Thailand</b><span class="where">Later</span><div class="chips"><span class="chip soon">Planned</span></div></div>' +
      '<button class="btn" disabled>Plan Utila (next screen)</button>'},
    dive:{t:'Dive', l:'Reefs, walls, wrecks, and learning to dive. We check certification so you do not find out at the dock.', b:
      item('Reef dive, two tanks','Sample dive shop · Utila',['m']) +
      item('Discover scuba (no certificate)','Sample dive shop · Utila',['m','a']) +
      item('Night dive','Sample dive shop · Utila',['e'])},
    snow:{t:'Snow & ice', l:'Not on Utila, but this is where cold places will live: skiing, sledding, northern lights.', b:
      '<div class="item"><b>Arctic and alpine</b><span class="where">Arrives when an island of snow joins the map.</span></div>'},
    stay:{t:'Stay', l:'A bunk, a room, a cabin. Where you sleep, and when check-in actually is.', b:
      item('Harbour guesthouse','Sample stay · Utila',['m','a','e']) +
      item('Hillside cabin','Sample stay · Utila',['a','e'])},
    eat:{t:'Eat', l:'Breakfast to late supper, open when the shop is open.', b:
      item('Josie’s Cafe','Coffee · breakfast · lunch · Utila',['m','a']) +
      item('Dockside supper','Sample · Utila',['e'])},
    rest:{t:'Rest & spa', l:'Massage, quiet, a long soak. The advice you would get from someone who has done it.', b:
      item('Shell Spa massage','Sample · Utila',['a','e']) +
      item('Quiet hour at the bay','Sample · Utila',['m','a'])},
    sail:{t:'Sail', l:'Tall ships, ferries and day boats.', b:
      item('Cays day sail','Sample · Utila',['m','a']) +
      item('Sunset sail','Sample · Utila',['e'])},
    fly:{t:'Fly', l:'Flights and bubble-helicopter tours when you want the island from above.', b:
      item('Island loop flight','Sample · Utila',['m','a'])}
  };
  var sheet = document.getElementById('sheet'), veil = document.getElementById('veil'), last;
  function open(k){ var d = D[k]; if(!d) return;
    document.getElementById('st').textContent = d.t;
    document.getElementById('sl').textContent = d.l;
    document.getElementById('sb').innerHTML = d.b;
    sheet.classList.add('on'); veil.classList.add('on'); sheet.setAttribute('aria-hidden','false');
    document.getElementById('close').focus(); }
  function shut(){ sheet.classList.remove('on'); veil.classList.remove('on'); sheet.setAttribute('aria-hidden','true'); if(last) last.focus(); }
  var objs = document.querySelectorAll('.obj');
  Array.prototype.forEach.call(objs, function(o){
    o.addEventListener('click', function(){ last = o; open(o.getAttribute('data-k')); });
    o.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); last = o; open(o.getAttribute('data-k')); } });
  });
  document.getElementById('close').addEventListener('click', shut);
  veil.addEventListener('click', shut);
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') shut(); });
})();
</script>
</body>
</html>
