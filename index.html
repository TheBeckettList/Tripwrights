<!doctype html>
<html lang="en" data-place="tripwrights">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tripwrights</title>
<meta name="description" content="Plan the trip like an outfitter would: morning, afternoon, evening.">
<link rel="stylesheet" href="art/tokens.css">
<style>
/* Tripwrights wears the shared island art kit (art/tokens.css, copied from utilatarian/art). Its own color is sea blue. */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.45 var(--u-body);display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:560px;padding:14px 16px 6px;display:flex;align-items:baseline;justify-content:space-between}
h1{font:800 30px/1 var(--u-display);margin:0;color:var(--accent-deep);letter-spacing:-.01em}
header small{color:var(--ink2);font-weight:700}
main{width:100%;max-width:560px;padding:0 16px 24px}
.hint{margin:2px 0 10px;color:var(--ink2);font-size:15px}
.scene{display:block;width:100%;height:auto;border-radius:var(--u-r-card);background:var(--w-sea)}
.obj{cursor:pointer;outline:none}
.obj .lift{transition:transform .15s ease;transform-box:fill-box;transform-origin:center}
.obj:hover .lift,.obj:focus-visible .lift{transform:translateY(-6px) scale(1.04)}
.obj:focus-visible .ring{opacity:1}
.ring{fill:none;stroke:#fff;stroke-width:5;stroke-dasharray:10 8;opacity:0}
.badge text{font:800 22px 'Baloo 2',sans-serif;fill:var(--accent-ink)}
.tag{font:800 34px 'Baloo 2',sans-serif;fill:#fff;paint-order:stroke;stroke:rgba(15,42,67,.55);stroke-width:9px;stroke-linejoin:round}
.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.spin{animation:spin 1.1s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes rip{50%{transform:translateX(10px)}}
.ripple{animation:rip 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.bob,.spin,.ripple{animation:none}}
.veil{position:fixed;inset:0;background:rgba(8,22,36,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:560px;max-height:78vh;overflow:auto;
  background:var(--card);color:var(--ink);border-radius:34px 34px 0 0;box-shadow:0 0 0 5px var(--soft),0 -10px 30px rgba(0,0,0,.25);
  padding:20px 16px 26px;transform:translate(-50%,105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.sheet.on{transform:translate(-50%,0);visibility:visible;transition:transform .25s ease}
.sheet h2{font:800 28px/1.05 var(--u-display);margin:0 0 4px}
.sheet p.lede{margin:0 0 12px;color:var(--ink2)}
.close{position:absolute;right:10px;top:10px;min-width:44px;min-height:44px;border:0;background:transparent;color:var(--accent-deep);font:800 26px var(--u-display);cursor:pointer}
.item{border-radius:24px;padding:12px 14px;margin:8px 0;background:var(--wash);box-shadow:inset 0 0 0 2px var(--soft)}
.item b{display:block;font-family:var(--u-display);font-size:18px}
.item span.where{color:var(--ink2);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:13px;font-weight:800;padding:3px 12px;border-radius:14px;background:var(--card);color:var(--ink2);box-shadow:inset 0 0 0 2px var(--line)}
.chip.ok{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.chip.off{opacity:.5;text-decoration:line-through}
.chip.soon{background:var(--w-closed);color:var(--w-closed-ink);box-shadow:none}
.btn{display:inline-block;min-height:44px;padding:10px 24px;border-radius:999px;background:var(--accent);color:var(--accent-ink);border:0;font:800 17px var(--u-display);cursor:pointer;margin-top:8px;box-shadow:0 4px 0 var(--edge)}
.btn[disabled]{opacity:.5;cursor:default}
.note{font-size:13px;color:var(--ink2);margin-top:10px}
.bar{width:100%;max-width:560px;display:flex;align-items:center;gap:8px;padding:0 16px 8px}
.pillbtn{border:0;cursor:pointer;min-height:44px;padding:0 16px;border-radius:999px;background:var(--wash);color:var(--accent-deep);box-shadow:inset 0 0 0 2px var(--soft);font:800 15px var(--u-display)}
.pillbtn.plan{margin-left:auto;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 var(--edge)}
.areaboat{transition:transform 1.4s cubic-bezier(.3,.7,.3,1)}
.days{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.days button{border:0;cursor:pointer;min-height:36px;padding:0 12px;border-radius:14px;background:var(--wash);color:var(--accent-deep);box-shadow:inset 0 0 0 2px var(--soft);font:800 14px var(--u-body)}
.days button.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.pcard{border-radius:26px;padding:14px 16px;margin:6px 0 10px}
.add{margin:6px 6px 0 0;min-height:40px;padding:8px 16px;font-size:15px}
.add.done{background:var(--w-ok);color:var(--w-ok-ink);box-shadow:none}
</style>
</head>
<body>
<header><h1>Tripwrights</h1><small id="sub">Off the coast of England</small></header>
<div class="bar"><button class="pillbtn" id="back" hidden>&larr; The rig</button><button class="pillbtn plan" id="planbtn">Plan &middot; <span id="pn">0</span></button></div>
<main>
<p class="hint" id="hint">Tap the globe to pick where you are going, or walk down the pier to a boat.</p>
<svg class="scene" id="scene" viewBox="0 0 1000 1500" role="group" aria-label="The Tripwrights sea habitat from above: a helipad, the globe hall, a seaplane jetty and a pier with one adventure boat for each place you can go."></svg>
<p class="note" id="note">Josie&rsquo;s Cafe is real; Utila Dives and everything else in the sheets is sample text.</p>
</main>
<div class="veil" id="veil"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="st" aria-hidden="true">
  <button class="close" id="close" aria-label="Close">&times;</button>
  <h2 id="st"></h2><p class="lede" id="sl"></p><div id="sb"></div>
</aside>
<script src="art/palettes.js"></script><script src="art/kit.js"></script><script src="rig.js"></script>
<script src="app.js"></script>
</body>
</html>
