<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tripwrights</title>
<meta name="description" content="Plan the trip like an outfitter would: morning, afternoon, evening.">
<style>
:root{
  --ink:#0F2A43; --sea:#1F5F8B; --tide:#4A90B8; --ice:#E8F1F6; --paper:#F6F1E7;
  --brass:#B8873B; --brass-ink:#2A1D07; --kelp:#3E7C6B; --rust:#C8553D;
  --floor:#E9DFC9; --floor2:#DDD0B4; --wall:#12385A; --deep:#1B5E86; --shallow:#6FB0CF;
  --bg:#E8F1F6; --text:#0F2A43; --card:#F6F1E7; --line:rgba(15,42,67,.18);
}
:root[data-theme="dark"]{ --bg:#0B1E31; --text:#EAF2F7; --card:#14314B; --line:rgba(234,242,247,.2); }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0B1E31; --text:#EAF2F7; --card:#14314B; --line:rgba(234,242,247,.2); }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:560px;padding:14px 16px 6px;display:flex;align-items:baseline;justify-content:space-between}
h1{font:700 26px/1 Georgia,"Fraunces","Bitter",serif;margin:0;letter-spacing:.2px}
header small{opacity:.75}
main{width:100%;max-width:560px;padding:0 16px 24px}
.hint{margin:2px 0 10px;opacity:.8;font-size:15px}
.scene{display:block;width:100%;height:auto;border-radius:18px;border:2px solid var(--line);background:var(--shallow)}
.obj{cursor:pointer;outline:none}
.obj .lift{transition:transform .15s ease;transform-box:fill-box;transform-origin:center}
.obj:hover .lift,.obj:focus-visible .lift{transform:translateY(-6px) scale(1.04)}
.obj:focus-visible .ring{opacity:1}
.ring{fill:none;stroke:#fff;stroke-width:5;stroke-dasharray:10 8;opacity:0}
.badge text{font:700 22px Georgia,serif;fill:var(--brass-ink)}
.tag{font:700 34px Georgia,serif;fill:#fff;paint-order:stroke;stroke:rgba(10,30,50,.7);stroke-width:9px;stroke-linejoin:round}
.bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.spin{animation:spin 1.1s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes rip{50%{transform:translateX(10px)}}
.ripple{animation:rip 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.bob,.spin,.ripple{animation:none}}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(8,22,36,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:560px;max-height:78vh;overflow:auto;
  background:var(--card);color:var(--text);border-radius:22px 22px 0 0;border-top:4px solid var(--brass);
  padding:18px 16px 26px;transform:translate(-50%,105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.sheet.on{transform:translate(-50%,0);visibility:visible;transition:transform .25s ease}
.sheet h2{font:700 24px/1.1 Georgia,serif;margin:0 0 4px}
.sheet p.lede{margin:0 0 12px;opacity:.85}
.close{position:absolute;right:10px;top:10px;min-width:44px;min-height:44px;border:0;background:transparent;color:inherit;font-size:26px;cursor:pointer}
.item{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;background:var(--bg)}
.item b{display:block}
.item span.where{opacity:.75;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:13px;padding:3px 9px;border-radius:99px;border:1px solid var(--line)}
.chip.ok{border-color:var(--kelp);color:var(--kelp)}
.chip.off{opacity:.45;text-decoration:line-through}
.chip.soon{border-color:var(--rust);color:var(--rust)}
.btn{display:inline-block;min-height:44px;padding:10px 18px;border-radius:12px;background:var(--sea);color:#fff;border:0;font:600 16px inherit;cursor:pointer;margin-top:8px}
.btn[disabled]{opacity:.5;cursor:default}
.note{font-size:13px;opacity:.7;margin-top:10px}
</style>
</head>

<div class="veil" id="veil"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="st" aria-hidden="true">
  <button class="close" id="close" aria-label="Close">×</button>
  <h2 id="st"></h2>
  <p class="lede" id="sl"></p>
  <div id="sb"></div>
</aside>

<script>
(function(){
  var B = {m:'Morning', a:'Afternoon', e:'Evening'};
  function chips(open){ return '<div class="chips">' + ['m','a','e'].map(function(k){
    return '<span class="chip ' + (open.indexOf(k) > -1 ? 'ok' : 'off') + '">' + B[k] + '</span>'; }).join('') + '</div>'; }
  function item(n, w, open, extra){ return '<div class="item"><b>' + n + '</b><span class="where">' + w + '</span>' + chips(open) + (extra || '') + '</div>'; }
  var D = {
    globe:{t:'The globe', l:'Where do you want to go? Pick an island to see what is open there.', b:
      item('Utila, Honduras','Live now · reef, cays, quiet town',['m','a','e']) +
      '<div class="item"><b>Roatán</b><span class="where">Soon</span><div class="chips"><span class="chip soon">Coming</span></div></div>' +
      '<div class="item"><b>Guanaja</b><span class="where">Soon</span><div class="chips"><span class="chip soon">Coming</span></div></div>' +
      '<div class="item"><b>Koh Tao, Thailand</b><span class="where">Later</span><div class="chips"><span class="chip soon">Planned</span></div></div>' +
      '<button class="btn" disabled>Plan Utila (next screen)</button>'},
    dive:{t:'Dive', l:'Reefs, walls, wrecks, and learning to dive. We check certification so you do not find out at the dock.', b:
      item('Reef dive, two tanks','Sample dive shop · Utila',['m']) +
      item('Discover scuba (no certificate)','Sample dive shop · Utila',['m','a']) +
      item('Night dive','Sample dive shop · Utila',['e'])},
    snow:{t:'Snow & ice', l:'Not on Utila, but this is where cold places will live: skiing, sledding, northern lights.', b:
      '<div class="item"><b>Arctic and alpine</b><span class="where">Arrives when an island of snow joins the map.</span></div>'},
    stay:{t:'Stay', l:'A bunk, a room, a cabin. Where you sleep, and when check-in actually is.', b:
      item('Harbour guesthouse','Sample stay · Utila',['m','a','e']) +
      item('Hillside cabin','Sample stay · Utila',['a','e'])},
    eat:{t:'Eat', l:'Breakfast to late supper, open when the shop is open.', b:
      item('Josie’s Cafe','Coffee · breakfast · lunch · Utila',['m','a']) +
      item('Dockside supper','Sample · Utila',['e'])},
    explore:{t:'Explore', l:'Trails, viewpoints, markets. The things you do on foot once you step off the ship.', b:
      item('Ridge walk to the lookout','Sample guide · Utila',['m']) +
      item('Town and market stroll','Sample · Utila',['m','a'])},
    rest:{t:'Rest & spa', l:'Massage, quiet, a long soak. The advice you would get from someone who has done it.', b:
      item('Shell Spa massage','Sample · Utila',['a','e']) +
      item('Quiet hour at the bay','Sample · Utila',['m','a'])},
    sail:{t:'Sail', l:'Tall ships, ferries and day boats.', b:
      item('Cays day sail','Sample · Utila',['m','a']) +
      item('Sunset sail','Sample · Utila',['e'])},
    fly:{t:'Fly', l:'Flights and bubble-helicopter tours when you want the island from above.', b:
      item('Island loop flight','Sample · Utila',['m','a'])}
  };
  var sheet = document.getElementById('sheet'), veil = document.getElementById('veil'), last;
  function open(k){ var d = D[k]; if(!d) return;
    document.getElementById('st').textContent = d.t;
    document.getElementById('sl').textContent = d.l;
    document.getElementById('sb').innerHTML = d.b;
    sheet.classList.add('on'); veil.classList.add('on'); sheet.setAttribute('aria-hidden','false');
    document.getElementById('close').focus(); }
  function shut(){ sheet.classList.remove('on'); veil.classList.remove('on'); sheet.setAttribute('aria-hidden','true'); if(last) last.focus(); }
  var objs = document.querySelectorAll('.obj');
  Array.prototype.forEach.call(objs, function(o){
    o.addEventListener('click', function(){ last = o; open(o.getAttribute('data-k')); });
    o.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); last = o; open(o.getAttribute('data-k')); } });
  });
  document.getElementById('close').addEventListener('click', shut);
  veil.addEventListener('click', shut);
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') shut(); });
})();
</script>
